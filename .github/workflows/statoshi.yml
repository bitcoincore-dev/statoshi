name: statoshi

on:
  push:
    branches: [ "master", "*" ]
  pull_request:
    branches: [ "master", "*" ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v3
    - name: ./autogen.sh
      run: |
        ./autogen.sh
    - name: make -C depends
      run: |
        make -C depends
    - name: ./configure
      run: |
        ./configure
    - name: make
      run: |
        make
